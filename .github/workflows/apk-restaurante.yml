name: Construir APK del Restaurante

# Se ejecuta a mano: GitHub → pestaña Actions → "Construir APK del Restaurante" → Run workflow.
# Genera una APK INDEPENDIENTE de las del repartidor y del admin (otro appId: com.brothers.restaurante) cuya pantalla de inicio es restaurante.html.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Repositorio compartido: configuración aislada en config/restaurante
      - name: Configuración del restaurante (paquete y Firebase)
        run: |
          for f in capacitor.config.json google-services.json; do
            if [ ! -f "config/restaurante/$f" ]; then
              echo "::error::Falta config/restaurante/$f en el repositorio."
              exit 1
            fi
            cp "config/restaurante/$f" "$f"
          done
          grep -n '"appId"' capacitor.config.json

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ACCIÓN CLAVE: Configura el caché y previene timeouts al descargar Gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Preparar la app web (entrada = restaurante.html)
        run: |
          mkdir -p www
          cp *.html *.css *.js www/
          # Iconos de las notificaciones (sw.js ya se copia con *.js)
          cp manifest.json www/ 2>/dev/null || true
          cp icon-192.png icon-512.png icon-maskable-512.png badge-96.png www/ 2>/dev/null || echo "::warning::Faltan iconos PNG en la raiz del repositorio (icon-192.png, icon-512.png, icon-maskable-512.png, badge-96.png)."
          # Icono de la app: puede estar en la raíz o en assets/ (si falta se usa icon-192.png)
          if [ -f icon-restaurante-only.png ]; then cp icon-restaurante-only.png www/icon-restaurante-only.png
          elif [ -f assets/icon-restaurante-only.png ]; then cp assets/icon-restaurante-only.png www/icon-restaurante-only.png
          else echo "::warning::No se encontró icon-restaurante-only.png ni en la raiz ni en assets/."; fi
          cp restaurante.html www/index.html

      - name: Instalar dependencias
        run: npm install --legacy-peer-deps

      # Plugin de segundo plano específico del Restaurante
      - name: Plugin de segundo plano
        run: |
          B='@anuradev/capacitor-background-mode@^6'
          npm install --legacy-peer-deps --save "$B" || echo "::warning::No se pudo instalar background-mode: no habrá modo de segundo plano."

      # Garantiza que Capacitor (core, android y CLI) estén bien instalados justo antes de crear el proyecto Android.
      # Repara el error "npm error could not determine executable to run" (el comando cap no existe en node_modules/.bin).
      - name: Verificar Capacitor
        run: |
          [ -f package.json ] || { echo "::warning::No hay package.json en la raíz: se crea uno."; npm init -y > /dev/null; }
          V=$(node -p "const p=require('./package.json');((p.dependencies||{})['@capacitor/core']||(p.devDependencies||{})['@capacitor/core']||'^6.1.2')")
          echo "Versión de Capacitor: $V"
          echo "--- @capacitor instalado:"; ls node_modules/@capacitor 2>/dev/null || echo "(no existe)"
          for P in core android cli; do
            if [ ! -d "node_modules/@capacitor/$P" ]; then
              echo "Instalando @capacitor/$P@$V"
              npm install --legacy-peer-deps --save "@capacitor/$P@$V"
            fi
          done
          if [ ! -x node_modules/.bin/cap ]; then
            echo "::warning::Falta el comando cap: se reinstalan las dependencias."
            npm install --legacy-peer-deps
            [ -x node_modules/.bin/cap ] || npm install --legacy-peer-deps --no-save "@capacitor/cli@$V"
          fi
          [ -x node_modules/.bin/cap ] || { echo "::error::No se encontró el comando cap (@capacitor/cli) en node_modules/.bin."; exit 1; }
          npx cap --version

      - name: Crear proyecto Android
        run: npx cap add android

      - name: Firebase (notificaciones push del Restaurante)
        run: |
          python3 - <<'PY'
          import json, os, shutil, sys
          if not os.path.exists('google-services.json'):
              print('::error::Falta google-services.json en la raiz del repositorio.')
              sys.exit(1)
          pkg = json.load(open('capacitor.config.json', encoding='utf-8'))['appId']
          gs = json.load(open('google-services.json', encoding='utf-8'))
          nombres = [c['client_info']['android_client_info']['package_name'] for c in gs.get('client', [])]
          if pkg not in nombres:
              print('::error::google-services.json es de otra app (%s). Debe ser de %s.' % (nombres, pkg))
              sys.exit(1)
          shutil.copy('google-services.json', 'android/app/google-services.json')
          print('google-services.json listo para', pkg)
          PY

      - name: Generar iconos
        run: |
          # Si el icono está en la raíz del repositorio, se usa como fuente del icono de la app
          mkdir -p assets
          if [ -f icon-restaurante-only.png ] && [ ! -f assets/icon-restaurante-only.png ]; then cp icon-restaurante-only.png assets/icon-restaurante-only.png; fi
          if [ -f assets/icon-restaurante-only.png ]; then
            cp assets/icon-restaurante-only.png assets/icon-only.png
          elif [ -f icon-512.png ]; then
            cp icon-512.png assets/icon-only.png
          fi
          if [ -f assets/icon-restaurante-foreground.png ]; then
            cp assets/icon-restaurante-foreground.png assets/icon-foreground.png
          fi
          if [ -f assets/icon-restaurante-background.png ]; then
            cp assets/icon-restaurante-background.png assets/icon-background.png
          fi
          if [ -d assets-restaurante ]; then rm -rf assets && cp -r assets-restaurante assets; fi
          if [ -f assets/icon-only.png ]; then npx --yes @capacitor/assets generate --android; else echo "::warning::Sin icono fuente: se usa el icono por defecto de Capacitor."; fi

      - name: Permisos y canal de notificaciones
        run: |
          python3 - <<'PY'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          perms = ["INTERNET", "POST_NOTIFICATIONS", "VIBRATE", "WAKE_LOCK", "USE_FULL_SCREEN_INTENT", "CAMERA", "REQUEST_IGNORE_BATTERY_OPTIMIZATIONS", "FOREGROUND_SERVICE", "FOREGROUND_SERVICE_SPECIAL_USE", "FOREGROUND_SERVICE_DATA_SYNC"]
          add = ''.join('    <uses-permission android:name="android.permission.%s" />\n' % x for x in perms if 'android.permission.%s"' % x not in s)
          if 'android.hardware.camera' not in s:
              add += '    <uses-feature android:name="android.hardware.camera" android:required="false" />\n'
          s = s.replace('<application', add + '    <application', 1)
          meta = '        <meta-data android:name="com.google.firebase.messaging.default_notification_channel_id" android:value="pedidos" />\n'
          if 'default_notification_channel_id' not in s:
              s = s.replace('</application>', meta + '    </application>', 1)
          open(p, 'w', encoding='utf-8').write(s)
          PY

      # Firma con la llave fija y estable
      - name: Firma estable y número de versión
        run: |
          python3 - <<'PY'
          import os, re, sys
          ws = os.environ['GITHUB_WORKSPACE']
          if not (os.path.exists('restaurante-release.keystore') and os.path.exists('restaurante-release.properties')):
              print('::error::Faltan restaurante-release.keystore y restaurante-release.properties en la raiz del repositorio.')
              sys.exit(1)
          props = {}
          for linea in open('restaurante-release.properties', encoding='utf-8'):
              if '=' in linea:
                  k, v = linea.strip().split('=', 1); props[k] = v
          p = 'android/app/build.gradle'
          s = open(p, encoding='utf-8').read()
          n = int(os.environ['GITHUB_RUN_NUMBER'])
          firma = ("\n    signingConfigs {\n        debug {\n            storeFile file('%s/restaurante-release.keystore')\n"
                   "            storePassword '%s'\n            keyAlias '%s'\n            keyPassword '%s'\n        }\n    }\n"
                   % (ws, props['storePassword'], props['keyAlias'], props['keyPassword']))
          s = s.replace('android {', 'android {' + firma, 1)
          s = re.sub(r'versionCode\s+\d+', 'versionCode %d' % (100 + n), s, count=1)
          s = re.sub(r'versionName\s+"[^"]*"', 'versionName "%d"' % n, s, count=1)
          open(p, 'w', encoding='utf-8').write(s)
          print('Firma estable lista · versionCode', 100 + n)
          PY

      - name: Sincronizar
        run: npx cap sync android

      - name: Compilar
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Nombrar el APK con su versión
        run: cp android/app/build/outputs/apk/debug/app-debug.apk brothers-restaurante-v${{ github.run_number }}.apk

      - name: Subir APK a Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: APK-Restaurante
          path: brothers-restaurante-v${{ github.run_number }}.apk

      - name: Publicar APK en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: restaurante-v${{ github.run_number }}
          name: Restaurante versión ${{ github.run_number }}
          files: brothers-restaurante-v${{ github.run_number }}.apk

      - name: Mostrar versión y enlace
        run: |
          echo "### APK del Restaurante listo" >> $GITHUB_STEP_SUMMARY
          echo "Versión: **${{ github.run_number }}**" >> $GITHUB_STEP_SUMMARY
          echo "Enlace directo: https://github.com/${{ github.repository }}/releases/download/restaurante-v${{ github.run_number }}/brothers-restaurante-v${{ github.run_number }}.apk" >> $GITHUB_STEP_SUMMARY
