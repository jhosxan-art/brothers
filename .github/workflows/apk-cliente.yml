name: Construir APK del Cliente

# Se ejecuta a mano: GitHub → pestaña Actions → "Construir APK del Cliente" → Run workflow.
# Genera una APK INDEPENDIENTE de las del repartidor, admin y restaurante (otro appId: com.brothers.cliente) cuya pantalla de inicio es cliente-app.html.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Repositorio compartido: configuración aislada en config/cliente
      - name: Configuración del cliente (paquete y Firebase)
        run: |
          for f in capacitor.config.json google-services.json; do
            if [ ! -f "config/cliente/$f" ]; then
              echo "::error::Falta config/cliente/$f en el repositorio."
              exit 1
            fi
            cp "config/cliente/$f" "$f"
          done
          grep -n '"appId"' capacitor.config.json

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ACCIÓN CLAVE: Configura el caché y previene timeouts al descargar Gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Preparar la app web (entrada = cliente-app.html)
        run: |
          mkdir -p www
          cp *.html *.css *.js www/
          # Iconos de las notificaciones (sw.js ya se copia con *.js)
          cp manifest.json www/ 2>/dev/null || true
          cp icon-192.png icon-512.png icon-maskable-512.png badge-96.png www/ 2>/dev/null || echo "::warning::Faltan iconos PNG en la raiz del repositorio (icon-192.png, icon-512.png, icon-maskable-512.png, badge-96.png)."
          for f in logo.png cliente-icon.png; do
            if [ -f "$f" ]; then cp "$f" "www/$f"; elif [ -f "assets/$f" ]; then cp "assets/$f" "www/$f"; fi
          done
          cp cliente-app.html www/index.html
          # Número de compilación que usa la actualización obligatoria del APK
          echo "window.APK_VERSION = ${{ github.run_number }};" > www/apk-version.js

      - name: Instalar dependencias
        run: |
          npm install --legacy-peer-deps
          npm install --legacy-peer-deps --save @capacitor-community/file-opener@^6 || echo "::warning::No se pudo instalar file-opener: la actualización abrirá el enlace en el navegador."

      # Garantiza que Capacitor (core, android y CLI) estén bien instalados justo antes de crear el proyecto Android.
      # Repara el error "npm error could not determine executable to run" (el comando cap no existe en node_modules/.bin).
      - name: Verificar Capacitor
        run: |
          [ -f package.json ] || { echo "::warning::No hay package.json en la raíz: se crea uno."; npm init -y > /dev/null; }
          V=$(node -p "const p=require('./package.json');((p.dependencies||{})['@capacitor/core']||(p.devDependencies||{})['@capacitor/core']||'^6.1.2')")
          echo "Versión de Capacitor: $V"
          echo "--- @capacitor instalado:"; ls node_modules/@capacitor 2>/dev/null || echo "(no existe)"
          for P in core android cli; do
            if [ ! -d "node_modules/@capacitor/$P" ]; then
              echo "Instalando @capacitor/$P@$V"
              npm install --legacy-peer-deps --save "@capacitor/$P@$V"
            fi
          done
          if [ ! -x node_modules/.bin/cap ]; then
            echo "::warning::Falta el comando cap: se reinstalan las dependencias."
            npm install --legacy-peer-deps
            [ -x node_modules/.bin/cap ] || npm install --legacy-peer-deps --no-save "@capacitor/cli@$V"
          fi
          [ -x node_modules/.bin/cap ] || { echo "::error::No se encontró el comando cap (@capacitor/cli) en node_modules/.bin."; exit 1; }
          npx cap --version

      - name: Crear proyecto Android
        run: npx cap add android

      - name: Firebase (notificaciones push del Cliente)
        run: |
          python3 - <<'PY'
          import json, os, shutil, sys
          if not os.path.exists('google-services.json'):
              print('::error::Falta google-services.json en la raiz del repositorio.')
              sys.exit(1)
          pkg = json.load(open('capacitor.config.json', encoding='utf-8'))['appId']
          gs = json.load(open('google-services.json', encoding='utf-8'))
          nombres = [c['client_info']['android_client_info']['package_name'] for c in gs.get('client', [])]
          if pkg not in nombres:
              print('::error::google-services.json es de otra app (%s). Debe ser de %s.' % (nombres, pkg))
              sys.exit(1)
          shutil.copy('google-services.json', 'android/app/google-services.json')
          print('google-services.json listo para', pkg)
          PY

      - name: Generar iconos
        run: |
          # Fuente del icono: cliente-icon.png (raíz o assets/) → logo.png → icon-512.png
          mkdir -p assets
          SRC_ICON=""
          for f in cliente-icon.png assets/cliente-icon.png logo.png assets/logo.png icon-512.png; do
            if [ -z "$SRC_ICON" ] && [ -f "$f" ]; then SRC_ICON="$f"; fi
          done
          if [ -n "$SRC_ICON" ]; then
            cp "$SRC_ICON" assets/icon-only.png
            python3 -m pip install --quiet pillow
            SRC_ICON="$SRC_ICON" python3 - <<'PYI'
          import os
          from PIL import Image
          im = Image.open(os.environ['SRC_ICON']).convert('RGBA')
          w, h = im.size; px = im.load()
          def util(x, y):
              r, g, b, a = px[x, y]
              return a > 20 and not (r > 235 and g > 235 and b > 235)
          xs = [x for x in range(0, w, 2) for y in range(0, h, 8) if util(x, y)]
          ys = [y for y in range(0, h, 2) for x in range(0, w, 8) if util(x, y)]
          if xs and ys:
              im = im.crop((max(0, min(xs)), max(0, min(ys)), min(w, max(xs) + 2), min(h, max(ys) + 2)))
          im = im.resize((1024, 1024), Image.LANCZOS)
          c = im.getpixel((512, 60))[:3]
          Image.new('RGBA', (1024, 1024), c + (255,)).save('assets/icon-background.png')
          im.save('assets/icon-foreground.png')
          im.save('assets/icon-only.png')
          PYI
            echo "Icono de la app: $SRC_ICON"
            npx --yes @capacitor/assets generate --android
          else echo "::warning::Sin icono fuente (cliente-icon.png / logo.png): se usa el icono por defecto de Capacitor."; fi

      - name: Permisos y canal de notificaciones
        run: |
          python3 - <<'PY'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          perms = ["INTERNET", "POST_NOTIFICATIONS", "VIBRATE", "WAKE_LOCK", "REQUEST_INSTALL_PACKAGES", "ACCESS_FINE_LOCATION", "ACCESS_COARSE_LOCATION", "CAMERA", "RECORD_AUDIO", "MODIFY_AUDIO_SETTINGS"]
          add = ''.join('    <uses-permission android:name="android.permission.%s" />\n' % x for x in perms if 'android.permission.%s"' % x not in s)
          if 'android.hardware.camera' not in s:
              add += '    <uses-feature android:name="android.hardware.camera" android:required="false" />\n'
          s = s.replace('<application', add + '    <application', 1)
          meta = '        <meta-data android:name="com.google.firebase.messaging.default_notification_channel_id" android:value="avisos" />\n'
          if 'default_notification_channel_id' not in s:
              s = s.replace('</application>', meta + '    </application>', 1)
          open(p, 'w', encoding='utf-8').write(s)
          PY

      # Firma con la llave fija y estable
      - name: Firma estable y número de versión
        run: |
          python3 - <<'PY'
          import os, re, sys
          ws = os.environ['GITHUB_WORKSPACE']
          # Si no hay llave propia del restaurante se reutiliza la del admin (Android permite la misma llave en apps con distinto appId)
          if not (os.path.exists('cliente-release.keystore') and os.path.exists('cliente-release.properties')):
              if os.path.exists('admin-release.keystore') and os.path.exists('admin-release.properties'):
                  import shutil
                  shutil.copy('admin-release.keystore', 'cliente-release.keystore')
                  shutil.copy('admin-release.properties', 'cliente-release.properties')
                  print('::notice::Sin llave propia: se usa la del admin para firmar.')
              else:
                  print('::error::Faltan cliente-release.keystore/.properties (o admin-release.keystore/.properties) en la raiz del repositorio.')
                  sys.exit(1)
          props = {}
          for linea in open('cliente-release.properties', encoding='utf-8'):
              if '=' in linea:
                  k, v = linea.strip().split('=', 1); props[k] = v
          p = 'android/app/build.gradle'
          s = open(p, encoding='utf-8').read()
          n = int(os.environ['GITHUB_RUN_NUMBER'])
          firma = ("\n    signingConfigs {\n        debug {\n            storeFile file('%s/cliente-release.keystore')\n"
                   "            storePassword '%s'\n            keyAlias '%s'\n            keyPassword '%s'\n        }\n    }\n"
                   % (ws, props['storePassword'], props['keyAlias'], props['keyPassword']))
          s = s.replace('android {', 'android {' + firma, 1)
          s = re.sub(r'versionCode\s+\d+', 'versionCode %d' % (100 + n), s, count=1)
          s = re.sub(r'versionName\s+"[^"]*"', 'versionName "%d"' % n, s, count=1)
          open(p, 'w', encoding='utf-8').write(s)
          print('Firma estable lista · versionCode', 100 + n)
          PY

      - name: Sincronizar
        run: npx cap sync android

      - name: Compilar
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Nombrar el APK con su versión
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Brothers-Deliverys-v${{ github.run_number }}.apk

      - name: Subir APK a Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Brothers-Deliverys
          path: Brothers-Deliverys-v${{ github.run_number }}.apk

      - name: Publicar APK en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: cliente-v${{ github.run_number }}
          name: Brothers Deliverys versión ${{ github.run_number }}
          files: Brothers-Deliverys-v${{ github.run_number }}.apk

      - name: Mostrar versión y enlace
        run: |
          echo "### APK de Brothers Deliverys listo" >> $GITHUB_STEP_SUMMARY
          echo "Versión: **${{ github.run_number }}**" >> $GITHUB_STEP_SUMMARY
          echo "Enlace directo: https://github.com/${{ github.repository }}/releases/download/cliente-v${{ github.run_number }}/Brothers-Deliverys-v${{ github.run_number }}.apk" >> $GITHUB_STEP_SUMMARY
