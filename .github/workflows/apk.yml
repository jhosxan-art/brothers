name: Construir APK del repartidor

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Preparar la app web
        run: |
          mkdir -p www
          cp *.html *.css *.js www/
          cp repartidor.html www/index.html

      - name: Instalar dependencias
        run: npm install --legacy-peer-deps

      - name: Crear proyecto Android
        run: npx cap add android

      - name: Permisos de Android
        run: |
          python3 - <<'PY'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p).read()
          perms = ["ACCESS_COARSE_LOCATION", "ACCESS_FINE_LOCATION", "FOREGROUND_SERVICE", "FOREGROUND_SERVICE_LOCATION", "POST_NOTIFICATIONS", "WAKE_LOCK", "CAMERA"]
          add = ''.join('    <uses-permission android:name="android.permission.%s" />\n' % x for x in perms if x not in s)
          s = s.replace('<application', add + '    <application', 1)
          open(p, 'w').write(s)
          PY

      - name: Sincronizar
        run: npx cap sync android

      - name: Compilar
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Subir APK a Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: APK-Repartidor
          path: android/app/build/outputs/apk/debug/app-debug.apk
