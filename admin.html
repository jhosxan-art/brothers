<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#3DB8F5">
  <title>Brother’s Deliverys — Administrador</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="admin">
  <header class="barra-marca">
    <span class="insignia" data-rider></span>
    <div class="titulo"><strong>Brother’s Deliverys</strong><small>Administrador</small></div>
    <button id="btnSalir" class="salir oculto" aria-label="Cerrar sesión">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0E141B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
    </button>
  </header>

  <!-- Inicio de sesión -->
  <main id="loginMain">
    <section id="vistaLogin" class="acciones">
      <div class="hero">
        <div class="gran-icono" data-rider></div>
        <h1>Panel de administración</h1>
        <p>Entra para ver a tus repartidores y gestionar tu equipo.</p>
      </div>
      <label>Correo <input id="email" type="email" autocomplete="username"></label>
      <label>Contraseña <input id="clave" type="password" autocomplete="current-password"></label>
      <div id="msgLogin" class="estado oculto"></div>
      <button id="btnLogin" class="primario">Entrar</button>
    </section>
  </main>

  <!-- Aplicación -->
  <div id="vistaApp" class="oculto">
    <section id="panelMapa">
      <div class="mapa-caja">
        <div id="mapaAdmin"></div>
        <div class="flota-mapa">
          <span id="contador" class="contador">0 en ruta</span>
          <button id="btnCentrar" class="primario">Ver todos</button>
        </div>
      </div>
      <div id="listaMapa"></div>
    </section>

    <section id="panelChats" class="oculto">
      <h2>Conversaciones</h2>
      <p class="ayuda">Todo lo que hablan los repartidores con sus clientes queda archivado aquí.</p>
      <div id="listaChats" class="acciones"></div>
    </section>

    <section id="panelEquipo" class="oculto">
      <div class="formulario-equipo">
        <h2>Agregar repartidor</h2>
        <label>Correo del repartidor <input id="nuevoCorreo" type="email" autocomplete="off" placeholder="rodrigo@gmail.com"></label>
        <label>Contraseña (mínimo 6 caracteres) <input id="nuevaClave" type="text" autocomplete="off" placeholder="Se la das al repartidor"></label>
        <div id="msgEquipo" class="estado oculto"></div>
        <button id="btnAgregar" class="primario">Crear repartidor</button>
      </div>
      <h2>Tu equipo</h2>
      <div id="listaEquipo" class="acciones"></div>
    </section>

    <nav class="tabs">
      <button class="activa" data-tab="panelMapa">Mapa en vivo</button>
      <button data-tab="panelChats">Chats</button>
      <button data-tab="panelEquipo">Equipo</button>
    </nav>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script>window.NOMBRE_APP = "admin";   // sesión independiente de la del repartidor</script>
  <script src="firebase-config.js"></script>
  <script src="iconos.js"></script>
  <script src="chat.js"></script>
  <script src="admin.js"></script>
</body>
</html>
