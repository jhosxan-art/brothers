<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#075E54">
<title>Brother’s Deliverys</title>
<link rel="stylesheet" href="cliente-app.css">
</head>
<body>
<div id="app">
  <header class="barra">
    <div class="avatar" id="avatar" aria-hidden="true">B</div>
    <div class="quien">
      <strong id="titulo">Brother’s Deliverys</strong>
      <small id="sub">Pide tu delivery</small>
    </div>
    <button id="btnFin" class="btn-fin" type="button" hidden>Finalizar</button>
  </header>

  <main id="chat" class="chat" aria-live="polite">
    <p id="hint" class="hint"></p>
    <div id="lista"></div>
  </main>

  <button id="fab" class="fab" type="button">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6z"/></svg>
    Nuevo pedido
  </button>

  <div id="cerrado" class="cerrado" hidden>Este chat fue cerrado. Toca “Nuevo pedido” para empezar otro.</div>

  <footer class="composer">
    <textarea id="entrada" rows="1" maxlength="600" placeholder="Escribe un mensaje" aria-label="Mensaje" autocomplete="off"></textarea>
    <button id="enviar" class="enviar" type="button" aria-label="Enviar mensaje">
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="currentColor" d="M2.01 21 23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </footer>

  <div id="toast" class="toast" role="status" hidden></div>

  <dialog id="dlg" class="dlg">
    <form method="dialog">
      <h2>Nuevo pedido</h2>
      <p>¿Con qué nombre te atiende el repartidor?</p>
      <input id="nombre" name="nombre" type="text" required minlength="2" maxlength="40" placeholder="Tu nombre" autocomplete="given-name">
      <div class="dlg-acc">
        <button value="cancel" formnovalidate class="sec">Cancelar</button>
        <button value="ok" class="pri">Empezar chat</button>
      </div>
    </form>
  </dialog>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>window.NOMBRE_APP = "cliente";</script>
<script src="firebase-config.js"></script>
<script src="cliente-app.js"></script>
</body>
</html>
