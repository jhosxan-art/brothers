<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#3DB8F5">
  <title>Brother’s Deliverys — Repartidor invitado</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="ordenes.css">
  <style>
    .pd-inv-mapa { position: relative; }
    .inv-herr { position: absolute; left: 10px; bottom: 14px; z-index: 1000; display: grid; gap: 8px; }
    .inv-herr button { width: 46px; height: 46px; padding: 0; display: grid; place-items: center; border-radius: 14px; background: #fff; border: 2px solid var(--linea, #D6DDE3); color: var(--tinta, #0E141B); font-size: 20px; line-height: 1; box-shadow: 0 3px 10px rgba(0, 0, 0, .22); -webkit-tap-highlight-color: transparent; }
    .inv-herr button.on { background: var(--celeste, #3DB8F5); border-color: var(--celeste-prof, #0A86C9); }
    .inv-herr button:focus-visible { outline: 3px solid var(--celeste-prof, #0A86C9); outline-offset: 2px; }
    .pago-det { font-weight: 700; color: var(--texto2, #4A5A6A); overflow-wrap: anywhere; }
    .pago-campo { display: flex; align-items: center; gap: 10px; height: 68px; padding: 0 16px; border: 2px solid var(--celeste, #3DB8F5); border-radius: 16px; background: #fff; text-align: left; }
    .pago-campo:focus-within { outline: 3px solid var(--celeste-prof, #0A86C9); outline-offset: 2px; }
    .pago-campo i { font-style: normal; font-weight: 800; font-size: 22px; color: var(--tinta, #0E141B); }
    .pago-campo input { flex: 1; min-width: 0; height: 100%; padding: 0; border: 0; outline: 0; background: transparent; box-shadow: none; font: 800 32px/1 "Plus Jakarta Sans", system-ui, sans-serif; text-align: right; color: var(--tinta, #0E141B); }
    body.pd-invitado { height: var(--vvh, 100dvh); }
    .chip-ocupado { display: inline-flex; align-items: center; gap: 4px; margin-left: 6px; padding: 1px 8px; border-radius: 999px; background: #25D366; color: #0E141B; font-size: 11px; font-weight: 800; vertical-align: middle; animation: pulsoOcupado 1.6s ease-in-out infinite; }
    .chip-ocupado.oculto { display: none !important; }
    @keyframes pulsoOcupado { 0%, 100% { box-shadow: 0 0 0 0 rgba(37,211,102,.55); } 50% { box-shadow: 0 0 0 6px rgba(37,211,102,0); } }
    @media (prefers-reduced-motion: reduce) { .chip-ocupado { animation: none; } }
    .info-ruta .ir-txt { display: grid; gap: 2px; min-width: 0; }
    .info-ruta .ir-txt b { display: block; font-size: 15px; line-height: 1.25; font-weight: 800; }
    .info-ruta .ir-txt b + span { display: block; font-size: 12px; opacity: .85; font-weight: 600; }
    #mapaEntrada { width: 100%; height: 220px; border-radius: 14px; overflow: hidden; border: 1.5px solid var(--linea, #E1E6EB); background: #f2f4f6; position: relative; isolation: isolate; }
    #infoEntrada { margin: -4px 0 4px; font-size: 12.5px; font-weight: 700; color: #0B4A6B; display: none; padding: 8px 12px; border-radius: 10px; background: #E8F6FE; border: 1px solid #CFE3F5; }
    #infoEntrada.oculto { display: none !important; }
    .pd-iniciar {
      margin: 4px 0 8px; height: 54px; padding: 0 16px; border: 0; border-radius: 14px;
      background: linear-gradient(135deg, #25D366 0%, #1E9B5A 100%); color: #fff;
      font-size: 16px; font-weight: 800; letter-spacing: .02em;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      box-shadow: 0 6px 16px rgba(37, 211, 102, .35); cursor: pointer; -webkit-tap-highlight-color: transparent;
    }
    .pd-iniciar:active { transform: scale(.98); }
    .pd-iniciar:focus-visible { outline: 3px solid #1E9B5A; outline-offset: 2px; }
    .pd-iniciar .pd-iniciar-ico { font-size: 22px; line-height: 1; }
    .acciones-fila-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
    .acciones-fila-3 button { height: 46px; font-size: 12.5px; padding: 0 6px; letter-spacing: -.01em; }
    @media (min-width: 700px) { .acciones-fila-3 button { height: 52px; font-size: 14px; padding: 0 10px; } }
    @media (min-width: 700px) {
      body.pd-invitado { background: #dfe6ec; }
      body.pd-invitado > .barra-marca { padding: calc(16px + env(safe-area-inset-top)) 22px 16px; }
      .pd-inv-mapa { min-height: 260px; }
      .pd-inv-panel { border-radius: 24px 24px 0 0; padding: 16px 20px calc(16px + env(safe-area-inset-bottom)); max-height: 60vh; }
      .pd-inv-panel .pd-precio b { font-size: 44px; }
      .pd-inv-panel .acciones-fila button { height: 54px; font-size: 15px; }
      .pd-inv-panel .pd-chat form button { height: 56px; font-size: 15px; }
      #mapaEntrada { height: 260px; }
    }
    @media (min-width: 900px) {
      body.pd-invitado { background: #cfdae2; }
      #vApp { max-width: 900px; margin: 0 auto; width: 100%; box-shadow: 0 0 0 1px var(--linea); }
      .pd-inv-mapa { min-height: 300px; }
      .pd-inv-panel { max-height: 58vh; padding: 18px 24px calc(18px + env(safe-area-inset-bottom)); }
      .pd-inv-panel .pd-inv-datos b { font-size: 15.5px; }
      .pd-inv-panel .pd-inv-datos span { font-size: 14.5px; }
      .pd-inv-panel .pd-precio b { font-size: 48px; }
      .pd-inv-panel .acciones-fila { gap: 10px; }
      .pd-inv-panel .acciones-fila button { height: 58px; font-size: 16px; }
      .pd-msgs { max-height: 26vh; }
      .info-ruta { font-size: 14px; padding: 10px 14px; }
      #mapaEntrada { height: 300px; }
    }
    @media (min-width: 1200px) {
      body.pd-invitado { background: #c8d4dd; }
      #vApp { max-width: 980px; box-shadow: 0 10px 40px rgba(14,20,27,.18); border-radius: 12px; margin: 16px auto; overflow: hidden; }
      .pd-inv-mapa { min-height: 340px; }
      .pd-inv-panel { max-height: 56vh; padding: 20px 28px calc(20px + env(safe-area-inset-bottom)); }
      .pd-inv-panel .pd-precio b { font-size: 54px; }
      .pd-inv-panel .acciones-fila button { height: 60px; font-size: 17px; }
      .pd-msgs { max-height: 24vh; }
      #mapaEntrada { height: 340px; }
    }
    @media (max-height: 500px) and (orientation: landscape) {
      .pd-inv-mapa { min-height: 48vh; }
      .pd-inv-panel { max-height: 44vh; padding: 10px 14px calc(10px + env(safe-area-inset-bottom)); gap: 8px; }
      .pd-inv-panel .pd-precio b { font-size: 30px; }
      #mapaEntrada { height: 180px; }
    }
  </style>
</head>
<body class="pd-invitado">
  <header class="barra-marca">
    <span class="insignia" data-rider></span>
    <div class="titulo"><strong>Brother’s Deliverys</strong><small id="subTitulo">Repartidor invitado <span id="chipOcupado" class="chip-ocupado oculto" role="status" aria-live="polite">🛵 OCUPADO</span></small></div>
    <button id="btnNuevosChats" class="oculto" type="button" aria-label="Pedidos" style="margin-left:auto;position:relative;width:46px;height:46px;padding:0;display:grid;place-items:center;border-radius:14px;background:#fff;border:2px solid var(--linea,#D6DDE3);font-size:20px;line-height:1">📥<span id="badgeNuevosChats" class="badge oculto" style="position:absolute;top:-6px;right:-6px">0</span></button>
  </header>

  <main id="vCarga" class="pd-inv-entrada"><div class="estado" id="msgCarga">Abriendo tu pedido…</div></main>

  <main id="vEntrada" class="pd-inv-entrada oculto">
    <div class="hero"><div class="gran-icono" data-rider></div><h1>¡Hola! Hay un pedido disponible</h1><p>Revísalo. Si lo aceptas, escribe tu nombre: el enlace quedará bloqueado para los demás.</p></div>
    <div class="tarjeta-rep"><div class="pd-inv-datos" id="resumenEntrada"></div></div>
    <div id="mapaEntrada" aria-label="Vista previa de la ruta hacia el primer retiro"></div>
    <div id="infoEntrada"></div>
    <label>Tu nombre <input id="inNombre" maxlength="24" autocomplete="given-name" placeholder="Ej. Carlos"></label>
    <div id="msgEntrada" class="estado error oculto"></div>
    <button id="btnEntrar" class="primario pd-aceptar" type="button">✅ Aceptar pedido</button>
  </main>

  <section id="vApp" class="oculto" style="flex:1;min-height:0;display:flex;flex-direction:column">
    <div class="pd-inv-mapa">
      <div id="mapaInv"></div>
      <div class="estado chip-gps" id="estadoGps">Obteniendo ubicación…</div>
      <div id="bannerRuta" class="info-ruta oculto" style="bottom:auto;top:52px"></div>
      <div class="inv-herr">
        <button id="btnSeguir" class="on" type="button" aria-pressed="true" aria-label="Seguirme (cámara de navegación)">🧭</button>
        <button id="btnVerTodo" type="button" aria-label="Ver todo el recorrido">⛶</button>
      </div>
    </div>
    <div class="pd-inv-panel" id="panelInv">
      <button id="btnMinPanel" class="pd-min" type="button" aria-expanded="true" aria-controls="detallesPanel"><span class="pd-barra"></span><span id="txtMin">Ocultar detalles ▾</span></button>
      <div id="precioGrande"></div>
      <div id="detallesPanel" style="display:grid;gap:10px">
        <div class="fila-repartidor" style="border:0;padding:0">
          <div class="pd-inv-datos" style="flex:1" id="datosPedido"></div>
          <span class="chip" id="chipEstado"></span>
        </div>
        <div class="acciones-fila">
          <button id="btnNavegar" class="mini" type="button">🧭 Abrir navegación</button>
        </div>
      </div>
      <button id="btnIniciarEntrega" class="pd-iniciar" type="button" aria-label="Iniciar entrega en modo navegación">
        <span class="pd-iniciar-ico" aria-hidden="true">🛵</span>
        <span>Iniciar Entrega</span>
      </button>
      <!-- FASE 2 · Retirado / Avisar llegué / Entregado en una sola fila -->
      <div class="acciones-fila acciones-fila-3">
        <button id="btnRetirado" class="oscuro" type="button">📦 Retirado</button>
        <button id="btnAvisarLlegada" class="oscuro" type="button" aria-label="Avisar al cliente que llegué">📢 Avisar llegué</button>
        <button id="btnEntregado" class="primario" type="button" disabled>✅ Entregado</button>
      </div>
      <div class="pd-chat">
        <button id="btnChatAdm" class="mini" type="button">🗨 Chat con Brothers (admin) <span id="chatAdmBadge" class="badge oculto">0</span></button>
        <div id="chatAdmBox" class="oculto">
          <div id="msgsAdm" class="pd-msgs"></div>
          <form id="formChatAdm" autocomplete="off"><input id="chatAdmTexto" maxlength="600" placeholder="Escribe al administrador…" aria-label="Mensaje al administrador"><button class="primario" type="submit">Enviar</button></form>
        </div>
      </div>
      <div class="pd-chat">
        <button id="btnChat" class="mini" type="button">💬 Chat con el cliente <span id="chatBadge" class="badge oculto">0</span></button>
        <div id="chatBox" class="oculto">
          <div id="msgs" class="pd-msgs"></div>
          <form id="formChat" autocomplete="off"><input id="chatTexto" maxlength="600" placeholder="Escribe un mensaje…" aria-label="Mensaje"><button class="primario" type="submit">Enviar</button></form>
        </div>
      </div>
    </div>
  </section>

  <div id="modalPago" class="modal-rep oculto" role="dialog" aria-modal="true" aria-labelledby="pagoTitulo">
    <div class="modal-rep-caja">
      <div class="gran-check">💵</div>
      <h2 id="pagoTitulo">Ingrese el valor pagado por el producto al restaurante</h2>
      <p id="pagoDetalle" class="pago-det"></p>
      <div class="pago-campo"><i>C$</i><input id="pagoMonto" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0.00" autocomplete="off" aria-label="Valor pagado al restaurante en córdobas"></div>
      <div id="pagoMsg" class="estado error oculto" role="alert"></div>
      <button id="btnPagoOk" class="primario" type="button">✅ Confirmar retiro</button>
      <button id="btnPagoCancelar" class="oscuro" type="button">Cancelar</button>
    </div>
  </div>

  <main id="vTomado" class="pd-inv-entrada oculto"><div class="tarjeta-rep pd-fin"><h2 id="txtTomado"></h2></div></main>
  <main id="vFin" class="pd-inv-entrada oculto"><div class="pd-fin"><div class="gran-check" style="font-size:64px">✓</div><h2 id="finTitulo"></h2><p id="finTxt" class="ayuda"></p></div></main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-rotate@0.2.8/dist/leaflet-rotate-src.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="iconos.js"></script>
  <script src="ordenes-core.js"></script>
  <script src="factura.js"></script>
  <script src="invitado.js"></script>
</body>
</html>
