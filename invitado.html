<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#3DB8F5">
  <title>Brother’s Deliverys — Repartidor invitado</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="ordenes.css">
  <style>
    /* Botones de la cámara de navegación (🧭 seguir · ⛶ ver todo) */
    .pd-inv-mapa { position: relative; }
    .inv-herr { position: absolute; left: 10px; bottom: 14px; z-index: 1000; display: grid; gap: 8px; }
    .inv-herr button { width: 46px; height: 46px; padding: 0; display: grid; place-items: center; border-radius: 14px; background: #fff; border: 2px solid var(--linea, #D6DDE3); color: var(--tinta, #0E141B); font-size: 20px; line-height: 1; box-shadow: 0 3px 10px rgba(0, 0, 0, .22); -webkit-tap-highlight-color: transparent; }
    .inv-herr button.on { background: var(--celeste, #3DB8F5); border-color: var(--celeste-prof, #0A86C9); }
    .inv-herr button:focus-visible { outline: 3px solid var(--celeste-prof, #0A86C9); outline-offset: 2px; }
    /* Ventana "valor pagado al restaurante" */
    .pago-det { font-weight: 700; color: var(--texto2, #4A5A6A); overflow-wrap: anywhere; }
    .pago-campo { display: flex; align-items: center; gap: 10px; height: 68px; padding: 0 16px; border: 2px solid var(--celeste, #3DB8F5); border-radius: 16px; background: #fff; text-align: left; }
    .pago-campo:focus-within { outline: 3px solid var(--celeste-prof, #0A86C9); outline-offset: 2px; }
    .pago-campo i { font-style: normal; font-weight: 800; font-size: 22px; color: var(--tinta, #0E141B); }
    .pago-campo input { flex: 1; min-width: 0; height: 100%; padding: 0; border: 0; outline: 0; background: transparent; box-shadow: none; font: 800 32px/1 "Plus Jakarta Sans", system-ui, sans-serif; text-align: right; color: var(--tinta, #0E141B); }
  </style>
</head>
<body class="pd-invitado">
  <header class="barra-marca">
    <span class="insignia" data-rider></span>
    <div class="titulo"><strong>Brother’s Deliverys</strong><small id="subTitulo">Repartidor invitado</small></div>
  </header>

  <!-- Cargando / enlace inválido -->
  <main id="vCarga" class="pd-inv-entrada"><div class="estado" id="msgCarga">Abriendo tu pedido…</div></main>

  <!-- 1) Entrada: solo el nombre -->
  <main id="vEntrada" class="pd-inv-entrada oculto">
    <div class="hero"><div class="gran-icono" data-rider></div><h1>¡Hola! Hay un pedido disponible</h1><p>Revísalo. Si lo aceptas, escribe tu nombre: el enlace quedará bloqueado para los demás.</p></div>
    <div class="tarjeta-rep"><div class="pd-inv-datos" id="resumenEntrada"></div></div>
    <label>Tu nombre <input id="inNombre" maxlength="24" autocomplete="given-name" placeholder="Ej. Carlos"></label>
    <div id="msgEntrada" class="estado error oculto"></div>
    <button id="btnEntrar" class="primario pd-aceptar" type="button">✅ Aceptar pedido</button>
  </main>

  <!-- 2) UI temporal del invitado: mapa + estado + chat -->
  <section id="vApp" class="oculto" style="flex:1;min-height:0;display:flex;flex-direction:column">
    <div class="pd-inv-mapa">
      <div id="mapaInv"></div>
      <div class="estado chip-gps" id="estadoGps">Obteniendo ubicación…</div>
      <div id="bannerRuta" class="info-ruta oculto" style="bottom:auto;top:52px"></div>
      <div class="inv-herr">
        <button id="btnSeguir" class="on" type="button" aria-pressed="true" aria-label="Seguirme (cámara de navegación)">🧭</button>
        <button id="btnVerTodo" type="button" aria-label="Ver todo el recorrido">⛶</button>
      </div>
    </div>
    <div class="pd-inv-panel" id="panelInv">
      <button id="btnMinPanel" class="pd-min" type="button" aria-expanded="true" aria-controls="detallesPanel"><span class="pd-barra"></span><span id="txtMin">Ocultar detalles ▾</span></button>
      <div id="precioGrande"></div>
      <div id="detallesPanel" style="display:grid;gap:10px">
        <div class="fila-repartidor" style="border:0;padding:0">
          <div class="pd-inv-datos" style="flex:1" id="datosPedido"></div>
          <span class="chip" id="chipEstado"></span>
        </div>
        <div class="acciones-fila">
          <button id="btnNavegar" class="mini" type="button">🧭 Abrir navegación</button>
        </div>
      </div>
      <div class="acciones-fila">
        <button id="btnRetirado" class="oscuro" type="button">📦 Retirado</button>
        <button id="btnEntregado" class="primario" type="button" disabled>✅ Entregado</button>
      </div>
      <div class="pd-chat">
        <button id="btnChatAdm" class="mini" type="button">🗨 Chat con Brothers (admin) <span id="chatAdmBadge" class="badge oculto">0</span></button>
        <div id="chatAdmBox" class="oculto">
          <div id="msgsAdm" class="pd-msgs"></div>
          <form id="formChatAdm" autocomplete="off"><input id="chatAdmTexto" maxlength="600" placeholder="Escribe al administrador…" aria-label="Mensaje al administrador"><button class="primario" type="submit">Enviar</button></form>
        </div>
      </div>
      <div class="pd-chat">
        <button id="btnChat" class="mini" type="button">💬 Chat con el cliente <span id="chatBadge" class="badge oculto">0</span></button>
        <div id="chatBox" class="oculto">
          <div id="msgs" class="pd-msgs"></div>
          <form id="formChat" autocomplete="off"><input id="chatTexto" maxlength="600" placeholder="Escribe un mensaje…" aria-label="Mensaje"><button class="primario" type="submit">Enviar</button></form>
        </div>
      </div>
    </div>
  </section>

  <!-- Cobro al retirar: el invitado declara cuánto pagó en el restaurante antes de marcar "Retirado" -->
  <div id="modalPago" class="modal-rep oculto" role="dialog" aria-modal="true" aria-labelledby="pagoTitulo">
    <div class="modal-rep-caja">
      <div class="gran-check">💵</div>
      <h2 id="pagoTitulo">Ingrese el valor pagado por el producto al restaurante</h2>
      <p id="pagoDetalle" class="pago-det"></p>
      <div class="pago-campo"><i>C$</i><input id="pagoMonto" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0.00" autocomplete="off" aria-label="Valor pagado al restaurante en córdobas"></div>
      <div id="pagoMsg" class="estado error oculto" role="alert"></div>
      <button id="btnPagoOk" class="primario" type="button">✅ Confirmar retiro</button>
      <button id="btnPagoCancelar" class="oscuro" type="button">Cancelar</button>
    </div>
  </div>

  <!-- Enlace ya tomado: único contenido visible -->
  <main id="vTomado" class="pd-inv-entrada oculto"><div class="tarjeta-rep pd-fin"><h2 id="txtTomado"></h2></div></main>

  <!-- 3) Final -->
  <main id="vFin" class="pd-inv-entrada oculto"><div class="pd-fin"><div class="gran-check" style="font-size:64px">✓</div><h2 id="finTitulo"></h2><p id="finTxt" class="ayuda"></p></div></main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Rotación del mapa (modo "hacia adelante"). Si no carga, la cámara sigue funcionando sin rotar. -->
  <script src="https://unpkg.com/leaflet-rotate@0.2.8/dist/leaflet-rotate-src.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="iconos.js"></script>
  <script src="ordenes-core.js"></script>
  <script src="invitado.js"></script>
</body>
</html>
